# Resolver DNS do Docker — evita crash do nginx se "api" ainda não existir (Swarm/Portainer).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $api http://api:8000;
    proxy_pass $api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics/ {
    set $api http://api:8000;
    proxy_pass $api/metrics/;
    proxy_set_header Host $host;
  }

  location /chatwoot/ {
    set $api http://api:8000;
    proxy_pass $api/chatwoot/;
    proxy_set_header Host $host;
  }

  location /admin/ {
    set $api http://api:8000;
    proxy_pass $api/admin/;
    proxy_set_header Host $host;
    client_max_body_size 10m;
  }

  location /media/ {
    set $api http://api:8000;
    proxy_pass $api/media/;
    proxy_set_header Host $host;
  }

  location /chat {
    set $api http://api:8000;
    proxy_pass $api/chat;
    proxy_set_header Host $host;
  }

  location /reset {
    set $api http://api:8000;
    proxy_pass $api/reset;
    proxy_set_header Host $host;
  }

  location /health {
    set $api http://api:8000;
    proxy_pass $api/health;
  }

  location /webhooks/ {
    set $api http://api:8000;
    proxy_pass $api/webhooks/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
