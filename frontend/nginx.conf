server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy para a API Sofia (serviço "api" no compose)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics/ {
    proxy_pass http://api:8000/metrics/;
    proxy_set_header Host $host;
  }

  location /chatwoot/ {
    proxy_pass http://api:8000/chatwoot/;
    proxy_set_header Host $host;
  }

  location /admin/ {
    proxy_pass http://api:8000/admin/;
    proxy_set_header Host $host;
    client_max_body_size 10m;
  }

  location /media/ {
    proxy_pass http://api:8000/media/;
    proxy_set_header Host $host;
  }

  location /chat {
    proxy_pass http://api:8000/chat;
    proxy_set_header Host $host;
  }

  location /reset {
    proxy_pass http://api:8000/reset;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:8000/health;
  }
}
