# Eva MOV FIBRA — Portainer / Docker Swarm
# Cole no Web editor. Troque a senha nos 2 lugares (POSTGRES_PASSWORD e DATABASE_URL).
# Postgres NÃO expõe porta no host (evita conflito com 5433).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sofia
      POSTGRES_PASSWORD: "TROQUE_ESTA_SENHA"
      POSTGRES_DB: sofia
    volumes:
      - iavendas_pg_data:/var/lib/postgresql/data
    networks:
      - iavendas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofia -d sofia"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      restart_policy:
        condition: any

  api:
    image: edreimp/iavendas-backend:latest
    environment:
      DATABASE_URL: postgresql://sofia:TROQUE_ESTA_SENHA@postgres:5432/sofia
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "20"
      PLANS_PROVIDER: postgres
      ADMIN_EMAIL: admin@movfibra.com
      ADMIN_PASSWORD: TROQUE_SENHA_ADMIN
      # Viabilidade (Google + IXC) — obrigatório para cobertura real
      COVERAGE_PROVIDER: ixc
      GOOGLE_MAPS_API_KEY: ""
      IXC_USER: ""
      IXC_PASSWORD: ""
      # Ferramentas n8n — fallback .env; painel (PostgreSQL) prevalece e persiste entre deploys
      CADASTRO_PROVIDER: webhook
      CADASTRO_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/cadastrar_cliente_sofia
      TERMOS_PROVIDER: webhook
      TERMOS_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/enviar_termos_sofia
      ATIVACAO_PROVIDER: webhook
      ATIVACAO_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/ativar_cliente_sofia
      AGENDA_PROVIDER: webhook
      AGENDA_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/buscar_horarios_agenda_sofia
      AGENDA_INSERIR_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/inserir_agendamento_sofia
      CHATWOOT_MSG_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/enviar_mensagem_sofia
      TRANSFER_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/transferir_atendimento_sofia
      RAG_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/consultar_rag_sofia
      IMAGEM_PLANO_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/enviar_imagem_plano_sofia
      ENCERRAR_WEBHOOK_URL: https://n8n2.mov.pro.br/webhook/encerrar_atendimento_sofia
      CPF_PROVIDER: ixc
    volumes:
      - iavendas_uploads:/app/uploads
    ports:
      - "8002:8000"
    networks:
      - iavendas_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: any

  frontend:
    image: edreimp/iavendas-frontend:latest
    ports:
      - "5180:80"
    networks:
      - iavendas_net
    deploy:
      restart_policy:
        condition: any

networks:
  iavendas_net:

volumes:
  iavendas_pg_data:
  iavendas_uploads:
