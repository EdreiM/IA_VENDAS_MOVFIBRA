# Eva MOV FIBRA — stack Portainer (Docker Hub)
# Cole TUDO no Web editor do Portainer.
# Troque SOMENTE a senha abaixo (linha POSTGRES_PASSWORD).

services:
  postgres:
    image: postgres:16-alpine
    container_name: iavendas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sofia
      POSTGRES_PASSWORD: "TROQUE_ESTA_SENHA"
      POSTGRES_DB: sofia
    volumes:
      - iavendas_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - iavendas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofia -d sofia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: edreimp/iavendas-backend:latest
    container_name: iavendas-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://sofia:TROQUE_ESTA_SENHA@postgres:5432/sofia
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "20"
      PLANS_PROVIDER: postgres
    volumes:
      - iavendas_uploads:/app/uploads
    ports:
      - "8001:8000"
    networks:
      - iavendas_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: edreimp/iavendas-frontend:latest
    container_name: iavendas-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5180:80"
    networks:
      - iavendas_net

networks:
  iavendas_net:

volumes:
  iavendas_pg_data:
  iavendas_uploads:
