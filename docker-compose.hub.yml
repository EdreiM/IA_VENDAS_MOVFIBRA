# Eva MOV FIBRA — Portainer / Docker Swarm
# Cole no Web editor. Troque a senha nos 2 lugares (POSTGRES_PASSWORD e DATABASE_URL).
# Postgres NÃO expõe porta no host (evita conflito com 5433).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sofia
      POSTGRES_PASSWORD: "TROQUE_ESTA_SENHA"
      POSTGRES_DB: sofia
    volumes:
      - iavendas_pg_data:/var/lib/postgresql/data
    networks:
      - iavendas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofia -d sofia"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      restart_policy:
        condition: any

  api:
    image: edreimp/iavendas-backend:latest
    environment:
      DATABASE_URL: postgresql://sofia:TROQUE_ESTA_SENHA@postgres:5432/sofia
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "20"
      PLANS_PROVIDER: postgres
    volumes:
      - iavendas_uploads:/app/uploads
    ports:
      - "8001:8000"
    networks:
      - iavendas_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: any

  frontend:
    image: edreimp/iavendas-frontend:latest
    ports:
      - "5180:80"
    networks:
      - iavendas_net
    deploy:
      restart_policy:
        condition: any

networks:
  iavendas_net:

volumes:
  iavendas_pg_data:
  iavendas_uploads:
