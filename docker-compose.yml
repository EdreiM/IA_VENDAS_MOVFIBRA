# IA VENDAS (Eva) — stack para Portainer / Docker Compose
# Portas externas escolhidas para NÃO conflitar com 8000/5173 de outros projetos:
#   API  → 8001
#   Dash → 5180
#   PG   → 5433

services:
  postgres:
    image: postgres:16-alpine
    container_name: iavendas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sofia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sofia}
    volumes:
      - sofia_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofia} -d ${POSTGRES_DB:-sofia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sofia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sofia}:${POSTGRES_PASSWORD:-sofia_change_me}@postgres:5432/${POSTGRES_DB:-sofia}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5180,http://localhost:5180}
      PLANS_PROVIDER: ${PLANS_PROVIDER:-postgres}
    volumes:
      - sofia_pg_data:/var/lib/postgresql/data
      - sofia_uploads:/app/uploads
    ports:
      - "${SOFIA_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    container_name: sofia-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SOFIA_DASH_PORT:-5180}:80"

volumes:
  sofia_pg_data:
  sofia_uploads:
