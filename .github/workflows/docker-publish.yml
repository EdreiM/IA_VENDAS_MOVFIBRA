# Build + push das imagens Eva no Docker Hub a cada push na main.
#
# Secrets no GitHub (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  = edreimp
#   DOCKERHUB_TOKEN     = token de acesso do Docker Hub (não use a senha da conta)

name: Docker Hub — Eva IA VENDAS

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.hub.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: edreimp/iavendas-backend
  FRONTEND_IMAGE: edreimp/iavendas-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
